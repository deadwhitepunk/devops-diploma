apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: diploma
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer
  namespace: diploma
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: diploma
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: diploma
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-deployer